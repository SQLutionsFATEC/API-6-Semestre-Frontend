name: Frontend CI

on:
  push:
    branches:
      - main
      - "develop-*"
  pull_request:
    branches:
      - main
      - "develop-*"
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-build:
    name: "Estágio 1: qualidade e build"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do código
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar análise estática com ESLint
        run: npm run lint

      - name: Gerar build de produção
        run: npm run build

  secondary-build:
    name: "Estágio 2: análise no SonarCloud"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: commit-build
    permissions:
      contents: read
      pull-requests: write
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Executar análise no SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Informar ausência do token do SonarCloud
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SonarCloud não executado porque o secret SONAR_TOKEN não está disponível."
